<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create an event - Bienvenu</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-container {
            background-color: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        .signup-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #EA5B6F;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .submit-btn {
            background-color: #EA5B6F;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background-color: #FF894F;
        }
    </style>
</head>
<body>

<!-- Header fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="signup-container">
        <h2>Create an Event</h2>
        <form th:action="@{/event/create}" th:object="${event}" method="post">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" th:field="*{title}" id="title" name="title" required />
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" th:field="*{description}" id="description" name="description" required />
            </div>

            <div class="form-group">
                <label for="place">Place</label>
                <input type="text" th:field="*{place}" id="place" name="place" required />
            </div>

            <div class="form-group">
                <label for="datetime">Date & Time</label>
                <input type="datetime-local" th:field="*{datetime}" id="datetime" name="datetime" required />
            </div>

            <input type="hidden" th:field="*{longitude}" id="longitude" value="0" />
            <input type="hidden" th:field="*{latitude}" id="latitude" value="0" />
            <input type="hidden" th:field="*{totalInterest}" value="0" />
            <button type="submit" class="submit-btn">Post Event!</button>
        </form>
    </div>
</main>

<!-- Footer fragment -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    window.onload = () => {
        if(navigator.geolocation){
            navigator.geolocation.getCurrentPosition((position) => {
                document.querySelector("#longitude").value = position.coords.longitude
                document.querySelector("#latitude").value = position.coords.latitude;
            });
        }else{
            alert("Please allow location!");
            window.location.reload();
        }
    }
</script>
</body>
</html>
