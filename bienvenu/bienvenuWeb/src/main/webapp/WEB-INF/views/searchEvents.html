<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en-US">
<head>
  <title>Bienvenu - Events Near You</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <style>
    .btn {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.3s ease;
    }
    .btn-view{
      background-color: var(--primary);
    }
    .btn-container {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<!-- Header Fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="container">

  <div th:each="event : ${events}" class="event-card">
    <div class="event-image-placeholder">
      <img th:src="@{'https://picsum.photos/seed/' + ${event.id} + '/200'}" width="200" height="200" alt="Event Image"/>
    </div>

    <div class="event-details">
      <div>
        <span class="heading" th:text="${event.title}">Event Title</span>
        <br/>
        <span class="description" th:text="${event.description}">Event Description</span>
      </div>
      <div>
        📍 <span th:text="${event.place}">Event Location</span>
        <br/>
        📅 <span th:text="${#temporals.format(event.datetime, 'd MMMM, yyyy')}">Event Date</span>
      </div>

      <!-- Edit/Delete Buttons -->
      <div class="btn-container">
        <a th:href="@{/event/{id}(id=${event.id})}" class="btn btn-view">ℹ️ View</a>
      </div>
    </div>

  </div>

</main>

<!-- Footer Fragment (if needed) -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
