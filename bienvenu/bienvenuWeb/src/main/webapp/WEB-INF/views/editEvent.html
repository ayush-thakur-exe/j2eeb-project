<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create an event - Bienvenu</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-container {
            background-color: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        .signup-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #EA5B6F;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .submit-btn {
            background-color: #EA5B6F;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background-color: #FF894F;
        }
    </style>
</head>
<body>

<!-- Header fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="signup-container">
        <h2>Edit Event</h2>
        <form th:action="@{/event/edit/{id}(id=${event.id})}" th:object="${event}" method="post">
            <!-- keep id so binding works -->
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" th:field="*{title}" id="title" name="title" required />
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" th:field="*{description}" id="description" name="description" required />
            </div>

            <div class="form-group">
                <label for="place">Place</label>
                <input type="text" th:field="*{place}" id="place" name="place" required />
            </div>

            <!-- ticket links -->
            <div class="form-group">
                <label>Ticket Links</label>

                <div id="links">
                    <!-- existing rows -->
                    <div th:each="t, i : ${event.ticketLinks}" class="row" style="display:flex;gap:8px;margin-bottom:8px;">
                        <input type="hidden" th:name="${'ticketLinks['+i.index+'].id'}" th:value="${t.id}">
                        <input th:name="${'ticketLinks['+i.index+'].platform'}" th:value="${t.platform}" placeholder="Platform" style="flex:0 0 40%;">
                        <input th:name="${'ticketLinks['+i.index+'].link'}" th:value="${t.link}" placeholder="https://…" style="flex:1;">
                        <button type="button" class="rm">✕</button>
                    </div>
                </div>

                <button type="button" id="add" style="margin-top:6px;">+ Add link</button>
            </div>

            <div class="form-group">
                <label for="datetime">Date & Time</label>
                <input
                        type="datetime-local"
                        id="datetime"
                        name="datetime"
                        th:value="${event.datetime != null} ? ${#temporals.format(event.datetime, 'yyyy-MM-dd''T''HH:mm')} : ''"
                        required />
            </div>

            <input type="hidden" th:field="*{longitude}" id="longitude"/>
            <input type="hidden" th:field="*{latitude}" id="latitude"/>
            <input type="hidden" th:field="*{totalInterest}" value="0" />
            <button type="submit" class="submit-btn">Save Event</button>
        </form>
    </div>
</main>

<!-- Footer fragment -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    window.onload = () => {
        if(navigator.geolocation){
            navigator.geolocation.getCurrentPosition((position) => {
                document.querySelector("#longitude").value = position.coords.longitude
                document.querySelector("#latitude").value = position.coords.latitude;
            });
        }else{
            alert("Please allow location!");
            window.location.reload();
        }

        function bindAddLink() {
            const wrap = document.getElementById('links');
            const addBtn = document.getElementById('add');

            function nextIndex() { return wrap.querySelectorAll('.row').length; }

            wrap.addEventListener('click', e => {
                if (e.target.classList.contains('rm')) e.target.closest('.row').remove();
            });

            addBtn.addEventListener('click', () => {
                const i = nextIndex();
                const row = document.createElement('div');
                row.className = 'row';
                row.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;';
                row.innerHTML = `
                <input type="hidden" name="ticketLinks[${i}].id" value="">
                <input name="ticketLinks[${i}].platform" placeholder="Platform" style="flex:0 0 40%;">
                <input name="ticketLinks[${i}].link" placeholder="https://…" style="flex:1;">
                <button type="button" class="rm">✕</button>
                `;
                wrap.appendChild(row);
            });
        }

        bindAddLink();
    }
</script>
</body>
</html>
